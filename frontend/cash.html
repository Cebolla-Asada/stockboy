<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stockboy | Manage Cash</title><link rel="stylesheet" href="styles.css"></head>

    <body><header class="site-header"><a class="brand" href="login.html">Stockboy</a><nav class="nav"><a href="login.html">Home</a><a href="stocks.html">Stocks</a><a class="active" href="account.html">Account</a></nav></header>

        <main class="page"><div class="hero-row"><div><h1>Manage Cash</h1><p class="subtitle">Deposit or withdraw funds from your cash account.</p></div>

            <section class="card"><div class="form-body center"><strong>Cash Balance</strong><div class="balance" data-user-field="cash_balance">{{CASH_BALANCE}}</div></div></section></div>

            <div class="grid-2 top-gap">
            <form class="card" id="deposit" name="depositForm" method="post" action="/api/account/deposit"><h2>Deposit Cash</h2><div class="form-body"><div class="field"><label for="depositAmount">Amount to Deposit</label><input id="depositAmount" name="amount" type="number" min="0.01" step="0.01" required></div>

            <button class="btn wide" id="depositButton" name="depositButton" type="submit">Deposit Cash</button></div></form>

            <form class="card" id="withdraw" name="withdrawForm" method="post" action="/api/account/withdraw"><h2>Withdraw Cash</h2><div class="form-body"><div class="field"><label for="withdrawAmount">Amount to Withdraw</label><input id="withdrawAmount" name="amount" type="number" min="0.01" step="0.01" required></div><div class="notice">Available cash: <strong>{{CASH_BALANCE}}</strong></div>

            <button class="btn wide top-gap" id="withdrawButton" name="withdrawButton" type="submit">Withdraw Cash</button></div></form></div><p><a href="account.html">← Back to Account Overview</a></p>
        </main>
    </body>
</html>
