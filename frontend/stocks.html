
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockboy | Stocks</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
    <a class="brand" href="index.html">Stockboy</a>
    <nav class="nav">
        <a href="index.html">Home</a>
        <a class="active" href="stocks.html">Stocks</a>
        <a href="account.html">Account</a>
    </nav>
</header>

<main class="page">
    <h1>Browse Stocks</h1>
    <p class="subtitle">
        View available stocks and simulated market information.
    </p>

    <section class="card top-gap">
        <h2>All Stocks</h2>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Ticker</th>
                        <th>Company</th>
                        <th>Current Price</th>
                        
                        
                      
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="stockRows">
                    <tr>
                        <td colspan="7">Loading stocks...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="card top-gap" id="stockDetails" hidden>
        <h2>Stock Details</h2>
        <div id="stockInformation"></div>
    </section>
</main>

<script>
    const stockRows = document.getElementById("stockRows");
    const stockDetails = document.getElementById("stockDetails");
    const stockInformation = document.getElementById("stockInformation");

    function formatPrice(price) {
        return "$" + Number(price).toFixed(2);
    }

    // Function 1: Display all stocks from the Python API
    async function loadStocks() {
        try {
            const response = await fetch("/api/stocks");

            if (!response.ok) {
                throw new Error("Unable to load stocks");
            }

            const data = await response.json();
            stockRows.replaceChildren();

            for (const stock of data.stocks) {
                const row = document.createElement("tr");

                const values = [
                    stock.ticker,
                    stock.company_name,
                    formatPrice(stock.current_price)                 
                  
                ];

                for (const value of values) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                }

                const actionCell = document.createElement("td");
                const button = document.createElement("button");

                button.textContent = "View Details";
                button.className = "btn";
                button.style.backgroundColor = "#2563eb";
                button.style.color = "#ffffff";
                button.style.padding = "10px 16px";
               
                 button.addEventListener("click", () => {
                    loadStockDetails(stock.ticker);
                });

                actionCell.appendChild(button);
                row.appendChild(actionCell);
                stockRows.appendChild(row);
            }

            if (data.stocks.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 7;
                cell.textContent = "No stocks available.";
                row.appendChild(cell);
                stockRows.appendChild(row);
            }

        } catch (error) {
            stockRows.replaceChildren();
            const row = document.createElement("tr");
            const cell = document.createElement("td");
            cell.colSpan = 7;
            cell.textContent = "Error loading stocks.";
            row.appendChild(cell);
            stockRows.appendChild(row);
        }
    }

    // Function 2: Display one stock using its ticker
    async function loadStockDetails(ticker) {
        stockDetails.hidden = false;
        stockInformation.textContent = "Loading stock details...";

        try {
            const response = await fetch(
                "/api/stocks/" + encodeURIComponent(ticker)
            );

            if (!response.ok) {
                throw new Error("Stock not found");
            }

            const data = await response.json();
            const stock = data.stock;

            stockInformation.replaceChildren();

            const details = [
                ["Company", stock.company_name],
                ["Ticker", stock.ticker],
                ["Current Price", formatPrice(stock.current_price)],
                ["Opening Price", formatPrice(stock.opening_price)],
                ["Day High", formatPrice(stock.day_high)],
                ["Day Low", formatPrice(stock.day_low)]
            ];

            for (const [label, value] of details) {
                const paragraph = document.createElement("p");
                const strong = document.createElement("strong");

                strong.textContent = label + ": ";
                paragraph.appendChild(strong);
                paragraph.appendChild(document.createTextNode(value));
                stockInformation.appendChild(paragraph);
            }

        } catch (error) {
            stockInformation.textContent =
                "Unable to retrieve stock details.";
        }
    }

    loadStocks();
</script>

</body>
</html>
