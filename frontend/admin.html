<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stockboy | Admin</title><link rel="stylesheet" href="styles.css"></head>

<body>
    <header class="site-header"><a class="brand" href="admin.html">Stockboy</a><nav class="nav"><a href="login.html">Home</a><a href="stocks.html">Stocks</a><a href="account.html">Account</a></nav></header>

    <main class="page"><h1>Admin Dashboard</h1><p class="subtitle">Manage stocks and market availability.</p><div class="grid-2 top-gap">

        <form class="card" id="createStockForm" name="createStockForm" method="post" action="/api/admin/stocks"><h2>Create New Stock</h2><div class="form-body"><div class="field"><label for="ticker">Ticker Symbol</label><input id="ticker" name="ticker" required></div><div class="field"><label for="company">Company Name</label><input id="company" name="company_name" required></div><div class="field"><label for="shares">Shares Available / Volume</label><input id="shares" name="volume" type="number" min="1" required></div><div class="field"><label for="price">Initial Price</label><input id="price" name="initial_price" type="number" min="0.01" step="0.01" required></div>

        <button class="btn wide" id="createStockButton" name="createStockButton" type="submit">Create Stock</button></div></form>

        <form class="card" id="marketHoursForm" name="marketHoursForm" method="post" action="/api/admin/market-hours"><h2>Market Hours & Days</h2><div class="form-body"><div class="field"><label for="openTime">Market Open</label><input id="openTime" name="open_time" type="time" required></div><div class="field"><label for="closeTime">Market Close</label><input id="closeTime" name="close_time" type="time" required></div><strong>Trading Days</strong><div class="check-grid top-gap"><label><input type="checkbox" name="days" value="monday"> Monday</label><label><input type="checkbox" name="days" value="tuesday"> Tuesday</label><label><input type="checkbox" name="days" value="wednesday"> Wednesday</label><label><input type="checkbox" name="days" value="thursday"> Thursday</label><label><input type="checkbox" name="days" value="friday"> Friday</label><label><input type="checkbox" name="days" value="saturday"> Saturday</label><label><input type="checkbox" name="days" value="sunday"> Sunday</label></div><div class="field top-gap"><label for="holiday">Closed Holiday / Date</label><input id="holiday" name="holiday" type="date"></div><button class="btn wide" id="saveMarketScheduleButton" name="saveMarketScheduleButton" type="submit">Save Market Hours & Schedule</button></div></form></div>

        <section class="card top-gap"><h2>Existing Stocks</h2><div class="table-wrap"><table><thead><tr><th>Ticker</th><th>Company</th><th>Shares Available</th><th>Current Price</th><th>Actions</th></tr></thead><tbody id="adminStockRows"><tr><td>{{TICKER}}</td><td>{{COMPANY_NAME}}</td><td>{{AVAILABLE_SHARES}}</td><td>{{CURRENT_PRICE}}</td><td><button class="btn secondary" type="button" name="editStockButton" data-stock-id="{{STOCK_ID}}">Edit</button> <button class="btn danger" type="button" name="deleteStockButton" data-stock-id="{{STOCK_ID}}">Delete</button></td></tr></tbody></table></div></section>
        </main>
    </body>
</html>
